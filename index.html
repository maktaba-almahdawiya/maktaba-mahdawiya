<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المكتبة المهدوية</title>
  <style>
    body {
      background-color: #0b0e14;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; color: #d4af37; margin-bottom: 30px; }
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .book-card {
      background: #121824;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s;
    }
    .book-card:hover {
      transform: translateY(-5px);
      border-color: #d4af37;
    }
    .book-cover {
      width: 100%;
      height: 200px;
      background: #1a2234;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4af37;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .book-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
    .book-author { font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>

  <h1>📚 المكتبة المهدوية</h1>

  <div class="books-grid">

    <!-- كتاب الكافي -->
    <a href="reader.html?book=data.json&title=الكافي" class="book-card">
      <div class="book-cover">الكافي</div>
      <div class="book-title">الكافي - الجزء الأول</div>
      <div class="book-author">الشيخ الكليني</div>
    </a>

    <!-- كتاب مستقبلي إضافي (مثال) -->
    <!--
    <a href="reader.html?book=bihar.json&title=بحار الأنوار" class="book-card">
      <div class="book-cover">بحار الأنوار</div>
      <div class="book-title">بحار الأنوار</div>
      <div class="book-author">الشيخ المجلسي</div>
    </a>
    -->

  </div>

</body>
</html>

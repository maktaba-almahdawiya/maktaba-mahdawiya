<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة المهدوية - قارئ الروايات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- الخطوط العربية -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0b0f19;
            color: #e5e7eb;
        }
        .font-amiri {
            font-family: 'Amiri', serif;
        }
        /* تخصيص شريط التمرير للمربع */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d97706;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-2xl mx-auto">

    <!-- الهيدر العلوي -->
    <header class="flex justify-between items-center border-b border-amber-900/40 pb-3 mb-4">
        <h1 class="text-xl font-bold text-amber-500 flex items-center gap-2">
            🏰 المكتبة المهدوية
        </h1>
        <a href="index.html" class="bg-amber-900/20 hover:bg-amber-900/40 text-amber-400 border border-amber-600/40 px-3 py-1.5 rounded-lg text-sm transition">
            ➔ العودة للرئيسية
        </a>
    </header>

    <!-- شريط البحث داخل الكتاب -->
    <div class="mb-4">
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="ابحث داخل هذا الكتاب..." 
            class="w-full bg-[#121826] border border-amber-900/30 rounded-xl px-4 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-amber-500 transition shadow-inner">
    </div>

    <!-- بطاقة عرض الرواية (بارتفاع نصف الشاشة) -->
    <main class="w-full min-h-[50vh] max-h-[60vh] bg-[#121826] border border-amber-600/30 rounded-2xl p-5 flex flex-col justify-between shadow-2xl relative overflow-hidden">
        
        <!-- أعلي البطاقة: اسم الكتاب ورقم الرواية وزر النسخ -->
        <div class="flex justify-between items-center text-xs text-amber-500/80 border-b border-amber-900/30 pb-3">
            <span id="bookTitle" class="font-bold">جاري التحميل...</span>
            <div class="flex items-center gap-3">
                <span id="hadithIndex">رواية #--</span>
                <button onclick="copyCurrentHadith()" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded border border-amber-500/30 transition flex items-center gap-1 text-xs">
                    📋 <span>نسخ</span>
                </button>
            </div>
        </div>

        <!-- منتصف البطاقة: النص (مع سكرول تلقائي عند الطول وتكبير للخط عند القصر) -->
        <div class="flex-grow flex items-center justify-center my-3 overflow-y-auto custom-scrollbar px-2">
            <p id="hadithText" class="w-full transition-all duration-300 font-amiri text-center">
                جاري تحميل النص...
            </p>
        </div>

        <!-- أسفل البطاقة: المصدر وعلامة التقليب -->
        <div class="flex justify-between items-center text-xs text-gray-500 border-t border-amber-900/30 pt-3">
            <span id="authorName">المكتبة المهدوية</span>
            <span class="text-amber-500/60">اسحب لليمين/اليسار للتقليب 👈👉</span>
        </div>
    </main>

    <!-- أزرار التصفح والتقليب -->
    <footer class="mt-4">
        <div class="flex justify-between items-center gap-2">
            <button onclick="prevHadith()" id="prevBtn" class="flex-1 bg-[#121826] hover:bg-amber-900/30 text-amber-400 border border-amber-900/40 py-2.5 rounded-xl transition text-sm font-semibold disabled:opacity-30">
                ➔ السابقة
            </button>
            
            <div id="pageCounter" class="text-xs text-amber-500/80 px-2 min-w-[70px] text-center font-bold">
                -- من --
            </div>

            <button onclick="nextHadith()" id="nextBtn" class="flex-1 bg-[#121826] hover:bg-amber-900/30 text-amber-400 border border-amber-900/40 py-2.5 rounded-xl transition text-sm font-semibold disabled:opacity-30">
                التالية ➔
            </button>
        </div>
    </footer>

    <!-- تنبيه عند النسخ -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-amber-600 text-black px-4 py-2 rounded-lg text-xs font-bold opacity-0 transition-opacity pointer-events-none shadow-lg">
        تم نسخ الرواية بنجاح!
    </div>

    <!-- السكريبت البرمجي -->
    <script>
        let allHadiths = [];
        let filteredHadiths = [];
        let currentIndex = 0;

        // معرفة اسم كتاب JSON من رابط الصفحة (مثال: reader.html?book=ghaiba_numani.json)
        const urlParams = new URLSearchParams(window.location.search);
        const bookFile = urlParams.get('book') || 'ghaiba_numani.json';

        // تحميل بيانات الكتاب
        async function loadBookData() {
            try {
                const response = await fetch(bookFile);
                const data = await response.json();
                
                // استخراج الروايات والعناوين
                if (Array.isArray(data)) {
                    allHadiths = data;
                } else if (data.hadiths) {
                    allHadiths = data.hadiths;
                    document.getElementById('bookTitle').innerText = data.title || "الكتاب";
                    document.getElementById('authorName').innerText = data.author || "المؤلف";
                }
                
                filteredHadiths = [...allHadiths];
                if (filteredHadiths.length > 0) {
                    renderHadith();
                } else {
                    document.getElementById('hadithText').innerText = "لا توجد بيانات داخل هذا الكتاب.";
                }
            } catch (error) {
                console.error("خطأ في تحميل البيانات:", error);
                document.getElementById('hadithText').innerText = "حدث خطأ أثناء تحميل ملف الكتاب.";
            }
        }

        // عرض الرواية الحالية وتعديل حجم الخط حسب طول النص
        function renderHadith() {
            if (filteredHadiths.length === 0) return;

            const item = filteredHadiths[currentIndex];
            const textElement = document.getElementById('hadithText');
            
            // تنظيف واستخراج النص
            let text = typeof item === 'string' ? item : (item.text || item.content || '');
            
            textElement.innerText = text;

            // كسر جمود النصوص القصيرة (تعديل الحجم والارتقاء بالنص)
            const textLength = text.trim().length;
            if (textLength < 50) {
                // نص قصير جداً (مثل البسملة) -> خط كبير جداً وفي المنتصف
                textElement.className = "w-full font-amiri text-2xl md:text-3xl text-amber-300 font-bold text-center leading-loose my-auto";
            } else if (textLength < 200) {
                // نص متوسط -> خط كبير
                textElement.className = "w-full font-amiri text-xl md:text-2xl text-amber-100 font-semibold text-center leading-relaxed my-auto";
            } else {
                // نص طويل -> خط مخصص للقراءة مع محاذاة ضبط
                textElement.className = "w-full font-amiri text-lg md:text-xl text-gray-200 text-justify leading-loose my-0";
            }

            // تحديث العناوين والأرقام
            document.getElementById('hadithIndex').innerText = `رواية #${item.id || currentIndex + 1}`;
            document.getElementById('pageCounter').innerText = `${currentIndex + 1} من ${filteredHadiths.length}`;

            // تعطيل/تفعيل الأزرار
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === filteredHadiths.length - 1;
        }

        // التقليب
        function nextHadith() {
            if (currentIndex < filteredHadiths.length - 1) {
                currentIndex++;
                renderHadith();
            }
        }

        function prevHadith() {
            if (currentIndex > 0) {
                currentIndex--;
                renderHadith();
            }
        }

        // البحث داخل الكتاب
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (query === "") {
                filteredHadiths = [...allHadiths];
            } else {
                filteredHadiths = allHadiths.filter(item => {
                    const text = typeof item === 'string' ? item : (item.text || item.content || '');
                    return text.toLowerCase().includes(query);
                });
            }
            currentIndex = 0;
            renderHadith();
        }

        // نسخ الرواية
        function copyCurrentHadith() {
            if (filteredHadiths.length === 0) return;
            const text = document.getElementById('hadithText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }

        // دعم التقليب عبر السحب باللمس على الشاشة
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) nextHadith(); // سحب لليسار
            if (touchEndX > touchStartX + 50) prevHadith(); // سحب لليمين
        }

        // تشغيل الصفحة عند التحميل
        loadBookData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة المهدوية - عرض الرواية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0d0f14;
            color: #e2e8f0;
        }
        .font-amiri {
            font-family: 'Amiri', serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-24">

    <!-- الهيدر العلوي وشريط المسار (Breadcrumbs) -->
    <header class="border-b border-amber-900/30 bg-[#12151e] px-4 py-3 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto">
            <!-- شريط المسار -->
            <div class="text-xs text-gray-400 flex items-center gap-2 mb-1">
                <a href="index.html" class="hover:text-amber-500">الرئيسية</a> / 
                <span id="bcBookTitle" class="text-amber-500">اسم الكتاب</span> / 
                <span id="bcHadithPage">الرواية</span>
            </div>
            <div class="flex justify-between items-center">
                <h1 id="bookMainTitle" class="text-lg font-bold text-amber-500">المكتبة المهدوية</h1>
                <a href="index.html" class="bg-amber-950/80 border border-amber-800/40 text-amber-400 px-3 py-1 rounded-lg text-xs hover:bg-amber-900/50 transition">
                    ➔ الرئيسية
                </a>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي (بطاقة الرواية والتفسير) -->
    <main class="max-w-3xl mx-auto px-4 mt-6 w-full flex-grow space-y-4">
        
        <!-- عنوان الباب أو الرواية مع زر البحث -->
        <div class="text-center space-y-2 mb-4">
            <h2 id="chapterTitle" class="text-2xl font-bold text-amber-400 font-amiri">خطبة الكتاب</h2>
            <p id="subTitleInfo" class="text-xs text-gray-400">الجزء الأول — الصفحة 1</p>
            <div class="pt-2 flex justify-center gap-2">
                <button onclick="toggleSearch()" class="bg-[#161a23] border border-amber-900/40 text-amber-400 text-xs px-3 py-1.5 rounded-lg flex items-center gap-1">
                    🔍 البحث في الكتاب
                </button>
            </div>
        </div>

        <!-- حقل البحث المخفي -->
        <div id="searchContainer" class="hidden mb-4">
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="اكتب للبحث داخل الكتاب..." 
                class="w-full bg-[#161a23] border border-amber-500/50 rounded-xl p-3 text-sm text-gray-200 outline-none">
        </div>

        <!-- مربع عرض الرواية الرئيسي -->
        <div class="bg-[#161a23] border border-amber-900/40 rounded-2xl p-6 shadow-2xl space-y-6">
            
            <!-- نص الرواية -->
            <div id="hadithBox" class="text-right">
                <p id="hadithText" class="font-amiri text-xl text-gray-100 leading-loose text-justify">
                    جاري تحميل النص...
                </p>
            </div>

            <!-- قسم الهوامش والشرح / المصدر (ظهر أسفل النص داخل نفس المربع) -->
            <div id="footnoteSection" class="border-t border-amber-900/30 pt-4 mt-6">
                <h4 class="text-xs font-bold text-amber-500 mb-2">هوامش وشرح الرواية:</h4>
                <div id="footnoteContent" class="text-xs text-gray-400 space-y-1 font-amiri leading-relaxed">
                    <!-- سيتم إضافة الشرح هنا برمجياً -->
                </div>
            </div>

        </div>
    </main>

    <!-- شريط التحكم والتقليب السفلية الثابت (Bottom Bar) -->
    <footer class="fixed bottom-0 left-0 right-0 bg-[#12151e]/95 border-t border-amber-900/40 backdrop-blur p-3 z-50">
        <div class="max-w-3xl mx-auto flex justify-between items-center gap-2 text-xs">
            
            <!-- زر السابق -->
            <button onclick="prevHadith()" id="prevBtn" class="bg-amber-950/80 border border-amber-800/40 text-amber-400 px-4 py-2 rounded-xl font-bold disabled:opacity-30">
                ➔ السابق
            </button>

            <!-- معلومات الصفحة وحجم الخط -->
            <div class="flex items-center gap-3 bg-[#161a23] px-3 py-1.5 rounded-xl border border-amber-900/30">
                <button onclick="changeFontSize(-2)" class="text-amber-500 font-bold text-sm px-1">-</button>
                <span id="fontSizeDisplay" class="text-gray-400">20</span>
                <button onclick="changeFontSize(2)" class="text-amber-500 font-bold text-sm px-1">+</button>
                <span class="text-gray-600">|</span>
                <span id="pageCounter" class="text-amber-400 font-bold">1 / 1</span>
            </div>

            <!-- أزرار الإجراءات (نسخ + التالي) -->
            <div class="flex items-center gap-2">
                <button onclick="copyCurrentHadith()" class="bg-[#161a23] border border-amber-900/40 text-amber-400 p-2 rounded-xl hover:bg-amber-900/30" title="نسخ الرواية">
                    📋
                </button>
                <button onclick="nextHadith()" id="nextBtn" class="bg-amber-600 text-black px-4 py-2 rounded-xl font-bold hover:bg-amber-500 transition disabled:opacity-30">
                    التالي ➔
                </button>
            </div>

        </div>
    </footer>

    <!-- التنبيه عند النسخ -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-amber-500 text-black px-4 py-2 rounded-xl text-xs font-bold opacity-0 transition-opacity z-50 pointer-events-none shadow-xl">
        تم نسخ الرواية وشرحها بنجاح!
    </div>

    <!-- السكريبت البرمجي -->
    <script>
        let allHadiths = [];
        let filteredHadiths = [];
        let currentIndex = 0;
        let currentFontSize = 20;

        const urlParams = new URLSearchParams(window.location.search);
        const bookFile = urlParams.get('book') || 'ghaiba_numani.json';

        async function loadBookData() {
            try {
                const response = await fetch(bookFile);
                const data = await response.json();
                
                let bookTitle = "الكتاب";
                if (Array.isArray(data)) {
                    allHadiths = data;
                } else if (data.hadiths) {
                    allHadiths = data.hadiths;
                    bookTitle = data.title || "الكتاب";
                }

                document.getElementById('bcBookTitle').innerText = bookTitle;
                document.getElementById('bookMainTitle').innerText = bookTitle;
                
                filteredHadiths = [...allHadiths];
                if (filteredHadiths.length > 0) renderHadith();
            } catch (error) {
                document.getElementById('hadithText').innerText = "خطأ في تحميل ملف الكتاب. تأكد من وجود ملف الـ JSON.";
            }
        }

        function renderHadith() {
            if (filteredHadiths.length === 0) return;

            const item = filteredHadiths[currentIndex];
            const textElement = document.getElementById('hadithText');
            const footnoteContent = document.getElementById('footnoteContent');
            
            // استخراج نص الرواية
            let text = typeof item === 'string' ? item : (item.text || item.content || '');
            textElement.innerText = text;

            // استخراج الشرح أو الهوامش إن وجدت
            let footnote = item.footnote || item.commentary || item.source || "1. المصدر: المكتبة المهدوية الإلكترونية.";
            footnoteContent.innerHTML = footnote;

            // عناوين البطاقة
            document.getElementById('chapterTitle').innerText = item.title || `رواية #${currentIndex + 1}`;
            document.getElementById('subTitleInfo').innerText = `الجزء 1 — الصفحة ${currentIndex + 1}`;
            document.getElementById('bcHadithPage').innerText = `الصفحة ${currentIndex + 1}`;
            document.getElementById('pageCounter').innerText = `${currentIndex + 1} / ${filteredHadiths.length}`;

            // تعطيل/تفعيل أزرار التنقل
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === filteredHadiths.length - 1;
        }

        function changeFontSize(delta) {
            currentFontSize += delta;
            if (currentFontSize < 14) currentFontSize = 14;
            if (currentFontSize > 36) currentFontSize = 36;
            document.getElementById('hadithText').style.fontSize = currentFontSize + 'px';
            document.getElementById('fontSizeDisplay').innerText = currentFontSize;
        }

        function nextHadith() {
            if (currentIndex < filteredHadiths.length - 1) {
                currentIndex++;
                renderHadith();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevHadith() {
            if (currentIndex > 0) {
                currentIndex--;
                renderHadith();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function toggleSearch() {
            const container = document.getElementById('searchContainer');
            container.classList.toggle('hidden');
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (query === "") {
                filteredHadiths = [...allHadiths];
            } else {
                filteredHadiths = allHadiths.filter(item => {
                    const text = typeof item === 'string' ? item : (item.text || item.content || '');
                    return text.toLowerCase().includes(query);
                });
            }
            currentIndex = 0;
            renderHadith();
        }

        function copyCurrentHadith() {
            const text = document.getElementById('hadithText').innerText;
            const footnote = document.getElementById('footnoteContent').innerText;
            const fullText = `${text}\n\n[الهوامش والشرح]:\n${footnote}`;
            
            navigator.clipboard.writeText(fullText).then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => toast.style.opacity = '0', 2000);
            });
        }

        loadBookData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة المهدوية - قارئ الروايات</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0b0f19;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            max-width: 650px;
            margin: 0 auto;
        }

        /* الهيدر وشريط البحث */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(217, 119, 6, 0.3);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .top-title { color: #f59e0b; font-weight: bold; font-size: 1.2rem; }
        .back-link {
            background: rgba(217, 119, 6, 0.15);
            color: #fcd34d;
            border: 1px solid rgba(217, 119, 6, 0.4);
            padding: 6px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .search-box { width: 100%; margin-bottom: 15px; }
        .search-input {
            width: 100%;
            background: #121826;
            border: 1px solid rgba(217, 119, 6, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-family: inherit;
            outline: none;
        }

        /* المربع الرئيسي - مجبر على أخذ نصف ارتفاع الشاشة */
        .hadith-card {
            width: 100%;
            min-height: 50vh; /* يجعل المربع يصل لنصف الشاشة دائماً */
            max-height: 60vh;
            background-color: #121826;
            border: 1px solid rgba(217, 119, 6, 0.35);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(217, 119, 6, 0.2);
            padding-bottom: 10px;
            font-size: 0.8rem;
            color: rgba(245, 158, 11, 0.8);
        }

        .btn-copy {
            background: rgba(217, 119, 6, 0.2);
            border: 1px solid rgba(217, 119, 6, 0.4);
            color: #fcd34d;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        /* حاوية النص والتنسيق الديناميكي */
        .card-body {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 15px 0;
            margin: 10px 0;
        }

        .hadith-text {
            font-family: 'Amiri', serif;
            width: 100%;
        }

        /* تكبير الخط للجمل القصيرة جداً لملء المربع */
        .text-short {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fcd34d;
            text-align: center;
            line-height: 2;
        }

        /* خط النصوص الطويلة */
        .text-long {
            font-size: 1.15rem;
            color: #e5e7eb;
            text-align: justify;
            line-height: 2;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(217, 119, 6, 0.2);
            padding-top: 10px;
            font-size: 0.75rem;
            color: #6b7280;
        }

        /* أزرار التنقل */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-nav {
            flex: 1;
            background: #121826;
            border: 1px solid rgba(217, 119, 6, 0.3);
            color: #f59e0b;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-counter { font-size: 0.8rem; color: #f59e0b; font-weight: bold; }

        /* التنبيه */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #d97706;
            color: #000;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div>
        <div class="top-bar">
            <span class="top-title">🏰 المكتبة المهدوية</span>
            <a href="index.html" class="back-link">➔ الرئيسية</a>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="ابحث داخل هذا الكتاب..." class="search-input">
        </div>
    </div>

    <!-- المربع الأساسي -->
    <div class="hadith-card">
        <div class="card-header">
            <span id="bookTitle">جاري التحميل...</span>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span id="hadithIndex">رواية #--</span>
                <button onclick="copyCurrentHadith()" class="btn-copy">📋 نسخ</button>
            </div>
        </div>

        <div class="card-body">
            <p id="hadithText" class="hadith-text">جاري تحميل النص...</p>
        </div>

        <div class="card-footer">
            <span id="authorName">المكتبة المهدوية</span>
            <span>اسحب لليمين/اليسار للتقليب 👈👉</span>
        </div>
    </div>

    <div class="nav-controls">
        <button onclick="prevHadith()" id="prevBtn" class="btn-nav">➔ السابقة</button>
        <span id="pageCounter" class="page-counter">-- من --</span>
        <button onclick="nextHadith()" id="nextBtn" class="btn-nav">التالية ➔</button>
    </div>

    <div id="toast">تم نسخ الرواية بنجاح!</div>

    <script>
        let allHadiths = [];
        let filteredHadiths = [];
        let currentIndex = 0;

        const urlParams = new URLSearchParams(window.location.search);
        const bookFile = urlParams.get('book') || 'ghaiba_numani.json';

        async function loadBookData() {
            try {
                const response = await fetch(bookFile);
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    allHadiths = data;
                } else if (data.hadiths) {
                    allHadiths = data.hadiths;
                    document.getElementById('bookTitle').innerText = data.title || "الكتاب";
                    document.getElementById('authorName').innerText = data.author || "المؤلف";
                }
                
                filteredHadiths = [...allHadiths];
                if (filteredHadiths.length > 0) renderHadith();
            } catch (error) {
                document.getElementById('hadithText').innerText = "حدث خطأ أثناء تحميل ملف الكتاب.";
            }
        }

        function renderHadith() {
            if (filteredHadiths.length === 0) return;

            const item = filteredHadiths[currentIndex];
            const textElement = document.getElementById('hadithText');
            let text = typeof item === 'string' ? item : (item.text || item.content || '');
            
            textElement.innerText = text;

            // التحكم بحجم الخط تلقائياً حسب طول النص لملء المربع
            if (text.trim().length < 80) {
                textElement.className = "hadith-text text-short";
            } else {
                textElement.className = "hadith-text text-long";
            }

            document.getElementById('hadithIndex').innerText = `رواية #${item.id || currentIndex + 1}`;
            document.getElementById('pageCounter').innerText = `${currentIndex + 1} من ${filteredHadiths.length}`;

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === filteredHadiths.length - 1;
        }

        function nextHadith() {
            if (currentIndex < filteredHadiths.length - 1) {
                currentIndex++;
                renderHadith();
            }
        }

        function prevHadith() {
            if (currentIndex > 0) {
                currentIndex--;
                renderHadith();
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (query === "") {
                filteredHadiths = [...allHadiths];
            } else {
                filteredHadiths = allHadiths.filter(item => {
                    const text = typeof item === 'string' ? item : (item.text || item.content || '');
                    return text.toLowerCase().includes(query);
                });
            }
            currentIndex = 0;
            renderHadith();
        }

        function copyCurrentHadith() {
            const text = document.getElementById('hadithText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => toast.style.opacity = '0', 2000);
            });
        }

        // دعم التمرير باللمس
        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) nextHadith();
            if (touchEndX > touchStartX + 50) prevHadith();
        });

        loadBookData();
    </script>
</body>
</html>
